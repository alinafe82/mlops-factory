name: Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlops-container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan:
    name: build-push
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          push: false
          tags: mlops-factory:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: mlops-factory:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    name: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}/mlops-factory
      IMMUTABLE_TAG: ghcr.io/${{ github.repository }}/mlops-factory:sha-${{ github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build immutable image once
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMMUTABLE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the exact image before publishing
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMMUTABLE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing commit tag
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if manifest="$(docker buildx imagetools inspect "${IMMUTABLE_TAG}" --format '{{json .Manifest}}' 2>/dev/null)"; then
            digest="$(jq -r '.digest' <<<"${manifest}")"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Existing tag returned an invalid digest" >&2
              exit 1
            fi
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate SPDX SBOM for the approved image
        if: steps.existing.outputs.exists == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMMUTABLE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: mlops-factory-sbom-${{ github.sha }}.spdx.json

      - name: Publish the approved immutable image
        id: publish
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMMUTABLE_TAG}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMMUTABLE_TAG}" | cut -d@ -f2)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the published image digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Resolve the immutable subject digest
        id: subject
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${PUBLISHED_DIGEST:-${EXISTING_DIGEST:-}}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve an immutable image digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Promote the approved digest to latest
        env:
          APPROVED_DIGEST: ${{ steps.subject.outputs.digest }}
        run: >-
          docker buildx imagetools create --prefer-index=false
          --tag "${IMAGE}:latest" "${IMAGE}@${APPROVED_DIGEST}"
