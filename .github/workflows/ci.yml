name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint
        run: flake8 app tests
      - name: Test API and data contracts
        run: PYTHONPATH=. pytest -q
