name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint
        run: flake8 app tests
      - name: Test API and data contracts
        run: PYTHONPATH=. pytest -q

  python-3-13:
    name: Python 3.13 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Test API and data contracts
        run: PYTHONPATH=. pytest -q
